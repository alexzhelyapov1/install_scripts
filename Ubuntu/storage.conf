# Where /mnt/storage comes from. Exactly one option must be uncommented.
# The storage step never touches an existing /mnt/storage, it only reports a mismatch.
# The only exception is a symlink to STORAGE_BIND left by earlier versions: it is replaced by the bind mount.

# Directory in home (created if missing), bind-mounted at /mnt/storage through /etc/fstab.
# Not a symlink: programs that resolve the real path (Claude Code keys chats by it) must see /mnt/storage.
STORAGE_BIND="/home/alex/.storage"

# Separate disk, mounted at /mnt/storage through /etc/fstab. Find the UUID with 'lsblk -f'.
# STORAGE_DISK_UUID="00000000-0000-0000-0000-000000000000"
